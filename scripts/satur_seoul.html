<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한양의 밤 스탭지</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Nanum Gothic", sans-serif;
    }

    /* A4 가로 규격 (297mm x 210mm) */
    .page-container {
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      background: white;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6mm;
    }
    .page-container:last-child {
      page-break-after: avoid;
    }

    .table-wrapper {
      width: 100%;
      height: 100%;
      border: 5px solid #000;
      display: flex;
      flex-direction: column;
    }

    /* 한 장당 무조건 4줄 균등 분할 (높이 25%씩) */
    .step-row {
      height: 25%;
      display: grid;
      grid-template-columns: 4.9fr 5.1fr; /* 좌우 5:5 분할 */
      border-bottom: 4px solid #000;
      line-height: 1;
    }
    .step-row:last-child {
      border-bottom: none;
    }

    /* 4박자 박스 */
    .step-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      overflow: hidden;
      gap: 8px;
    }
    .step-cell:first-child {
      border-right: 4px solid #000; /* 가운데 구분선 */
    }

    /* 텍스트 요소 */
    .step-name {
      color: #000;
      font-size: 50pt;
      font-weight: 900;
      letter-spacing: -2px;
      display: block;
      flex: 1;
      min-width: 0;
      line-height: 1.05;
      white-space: nowrap;
    }
    .sub-desc {
      font-size: 40pt;
      color: #c90000;
      font-weight: 900;
      letter-spacing: -1px;
    }
    /* 배경 컬러 */
    .bg-orange { background-color: #ffd8a8; }
    .bg-yellow { background-color: #ffec99; }
    .bg-mint   { background-color: #c3fae8; }
    .bg-blue   { background-color: #d0ebff; }
    .bg-white  { background-color: #ffffff; }

    @media print {
      body {
        background: transparent;
      }
      .page-container {
        margin: 0 !important;
        width: 297mm !important;
        height: 210mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1페이지 (1~4번 줄) -->
  <div class="page-container">
    <div class="table-wrapper">

      <!-- 1번 줄 -->
      <div class="step-row bg-orange">
        <div class="step-cell">
          <div class="step-name">러닝맨힐</div>
        </div>
        <div class="step-cell">
          <div class="step-name">러닝맨힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
      </div>

      <!-- 2번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">러닝맨힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">러닝맨 턴<span class="sub-desc">(오른쪽)</span></div>
        </div>
      </div>

      <!-- 3번 줄 -->
      <div class="step-row bg-yellow">
        <div class="step-cell">
          <div class="step-name">T스텝<span class="sub-desc">(제자리)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">T스텝 이동</div>
        </div>
      </div>

      <!-- 4번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">T스텝<span class="sub-desc">(제자리.)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">T스텝 리버스</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 2페이지 (5~8번 줄) -->
  <div class="page-container">
    <div class="table-wrapper">

      <!-- 5번 줄 -->
      <div class="step-row bg-orange">
        <div class="step-cell">
          <div class="step-name">찰스턴<span class="sub-desc">(앞2,뒤2)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">찰스턴사이드</div>
        </div>
      </div>

      <!-- 6번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">크크W</div>
        </div>
        <div class="step-cell">
          <div class="step-name">V스텝<span class="sub-desc">(싱싱더블)</span></div>
        </div>
      </div>

      <!-- 7번 줄 -->
      <div class="step-row bg-yellow">
        <div class="step-cell">
          <div class="step-name">V스텝<span class="sub-desc">(싱싱더블)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">점핑힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
      </div>

      <!-- 8번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">점핑힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">M스텝</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 3페이지 (9~12번 줄) -->
  <div class="page-container">
    <div class="table-wrapper">

      <!-- 9번 줄 -->
      <div class="step-row bg-orange">
        <div class="step-cell">
          <div class="step-name">러닝맨힐</div>
        </div>
        <div class="step-cell">
          <div class="step-name">러닝맨힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
      </div>

      <!-- 10번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">러닝맨힐<span class="sub-desc">(싱싱더블)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">T스텝 회전<span class="sub-desc">(오른쪽)</span></div>
        </div>
      </div>

      <!-- 11번 줄 -->
      <div class="step-row bg-yellow">
        <div class="step-cell">
          <div class="step-name">힐트위스트</div>
        </div>
        <div class="step-cell">
          <div class="step-name">Y스텝</div>
        </div>
      </div>

      <!-- 12번 줄 -->
      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">러닝맨 문워크</div>
        </div>
        <div class="step-cell">
          <div class="step-name">러닝맨 3스텝</div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
