<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>브라더 루이 스탭지</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Nanum Gothic", sans-serif;
    }

    /* A4 가로 1장 규격 (297mm x 210mm) */
    .page-container {
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      background: white;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6mm;
    }
    .page-container:last-child {
      page-break-after: avoid;
    }

    .table-wrapper {
      width: 100%;
      height: 100%;
      border: 5px solid #000;
      display: flex;
      flex-direction: column;
    }

    /* 한 장당 무조건 4줄 균등 분할 (높이 25%씩) */
    .step-row {
      height: 25%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 4px solid #000;
      font-size: 52pt;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }
    .step-row:last-child {
      border-bottom: none;
    }

    /* 텍스트 요소 */
    .step-name {
      color: #000;
      display: flex;
      align-items: baseline;
      gap: 15px;
      white-space: nowrap;
    }
    .sub-desc {
      font-size: 34pt;
      color: #c90000;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .count {
      color: #d32f2f;
      font-size: 64pt;
      font-weight: 900;
      min-width: 90px;
      text-align: right;
    }

    /* 배경 컬러 */
    .bg-orange { background-color: #ffd8a8; }
    .bg-yellow { background-color: #ffec99; }
    .bg-mint   { background-color: #c3fae8; }
    .bg-blue   { background-color: #d0ebff; }
    .bg-white  { background-color: #ffffff; }

    /* 끝 표시 줄 */
    .end-row {
      justify-content: center;
      background-color: #ffc9c9;
    }
    .end-text {
      color: #c92a2a;
      font-size: 70pt;
      font-weight: 900;
      letter-spacing: 20px;
    }

    @media print {
      body {
        background: transparent;
      }
      .page-container {
        margin: 0 !important;
        width: 297mm !important;
        height: 210mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1페이지 -->
  <div class="page-container">
    <div class="table-wrapper">
      <div class="step-row bg-orange">
        <div class="step-name">런닝맨</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">말레이시안</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-yellow">
        <div class="step-name">T스텝</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">찰스턴</div>
        <div class="count">8</div>
      </div>
    </div>
  </div>

  <!-- 2페이지 -->
  <div class="page-container">
    <div class="table-wrapper">
      <div class="step-row bg-mint">
        <div class="step-name">Y스텝</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">인디언스텝</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-yellow">
        <div class="step-name">W스텝</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">
          V스텝 <span class="sub-desc">(싱싱더블)</span>
        </div>
        <div class="count">8</div>
      </div>
    </div>
  </div>

  <!-- 3페이지 -->
  <div class="page-container">
    <div class="table-wrapper">
      <div class="step-row bg-orange">
        <div class="step-name">
          러닝맨턴 <span class="sub-desc">(회전)</span>
        </div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">힐트위스트</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-blue">
        <div class="step-name">점핑힐(싱싱더블)</div>
        <div class="count">8</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">러닝맨힐(싱싱더블)</div>
        <div class="count">8</div>
      </div>
    </div>
  </div>

  <!-- 4페이지 -->
  <div class="page-container">
    <div class="table-wrapper">
      <div class="step-row bg-yellow">
        <div class="step-name">
          찰스턴
        </div>
        <div class="count">4</div>
      </div>
      <div class="step-row bg-white">
        <div class="step-name">
          찰스턴 사이드
        </div>
        <div class="count">4</div>
      </div>
      <div class="step-row end-row" style="height: 50%;">
        <div class="end-text">끝</div>
      </div>
    </div>
  </div>

</body>
</html>
