<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스테이인얼라이브 스탭지</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Nanum Gothic", sans-serif;
    }

    .page-container {
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      background: white;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6mm;
    }
    .page-container:last-child {
      page-break-after: avoid;
    }

    .table-wrapper {
      width: 100%;
      height: 100%;
      border: 5px solid #000;
      display: flex;
      flex-direction: column;
    }

    .step-row {
      height: 25%;
      display: grid;
      grid-template-columns: 4.5fr 5.5fr;
      border-bottom: 4px solid #000;
      line-height: 1;
    }
    .step-row:last-child {
      border-bottom: none;
    }
    .step-row.full-row {
      grid-template-columns: 1fr;
    }
    .step-row.full-row .step-cell:first-child {
      border-right: none;
    }

    .step-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      overflow: hidden;
      gap: 8px;
    }
    .step-cell:first-child {
      border-right: 4px solid #000;
    }

    .step-name {
      color: #000;
      font-size: 50pt;
      font-weight: 900;
      letter-spacing: -2px;
      display: block;
      flex: 1;
      min-width: 0;
      line-height: 1.05;
      white-space: nowrap;
    }
    .step-name.compact {
      font-size: 34pt;
    }
    .step-name.tight {
      font-size: 28pt;
      letter-spacing: -1px;
    }
    .step-name.wrap {
      white-space: normal;
      font-size: 30pt;
      line-height: 1.1;
    }
    .sub-desc {
      font-size: 36pt;
      color: #c90000;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .step-name.compact .sub-desc {
      font-size: 26pt;
    }
    .step-name.tight .sub-desc,
    .step-name.wrap .sub-desc {
      font-size: 22pt;
    }
    .bg-orange { background-color: #ffd8a8; }
    .bg-yellow { background-color: #ffec99; }
    .bg-white  { background-color: #ffffff; }

    @media print {
      body {
        background: transparent;
      }
      .page-container {
        margin: 0 !important;
        width: 297mm !important;
        height: 210mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1페이지 -->
  <div class="page-container">
    <div class="table-wrapper">

      <div class="step-row bg-orange">
        <div class="step-cell">
          <div class="step-name wrap">런닝맨힐<span class="sub-desc">(오·2)</span><br>킥볼해피핏</div>
        </div>
        <div class="step-cell">
          <div class="step-name">인디언</div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name wrap">런닝맨힐<span class="sub-desc">(왼·2)</span><br>킥볼해피핏</div>
        </div>
        <div class="step-cell">
          <div class="step-name compact">점핑힐 W스텝</div>
        </div>
      </div>

      <div class="step-row bg-yellow">
        <div class="step-cell">
          <div class="step-name compact">런닝맨시저스</div>
        </div>
        <div class="step-cell">
          <div class="step-name wrap">힐토홉<span class="sub-desc">(시저스)</span><br>힐토사이드</div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">Y스텝</div>
        </div>
        <div class="step-cell">
          <div class="step-name">파티머신</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 2페이지 -->
  <div class="page-container">
    <div class="table-wrapper">

      <div class="step-row bg-orange">
        <div class="step-cell">
          <div class="step-name wrap">찰스턴<span class="sub-desc">(앞&뒤)</span><br>카우테일</div>
        </div>
        <div class="step-cell">
          <div class="step-name wrap">찰스턴하이<span class="sub-desc">(2)</span><br>크리스크로스<span class="sub-desc">(2)</span></div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name wrap">T스텝<span class="sub-desc">(옆앞·2)</span><br>카멜스텝<span class="sub-desc">(2)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name wrap">팬듈룸<span class="sub-desc">(옆2)</span><br>팬듈룸<span class="sub-desc">(앞2)</span></div>
        </div>
      </div>

      <div class="step-row bg-yellow">
        <div class="step-cell">
          <div class="step-name">써클<span class="sub-desc">(오)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">킥볼체인지</div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">써클<span class="sub-desc">(왼)</span></div>
        </div>
        <div class="step-cell">
          <div class="step-name">하우스셔플</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 3페이지 -->
  <div class="page-container">
    <div class="table-wrapper">

      <div class="step-row bg-orange full-row">
        <div class="step-cell">
          <div class="step-name compact">크로스런닝맨 싱싱더블<span class="sub-desc">(8)</span></div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name">스폰지밥</div>
        </div>
        <div class="step-cell">
          <div class="step-name compact">사이드스텝<span class="sub-desc">(손위로)</span></div>
        </div>
      </div>

      <div class="step-row bg-yellow full-row">
        <div class="step-cell">
          <div class="step-name">T스텝<span class="sub-desc">(팔굴려·4)</span></div>
        </div>
      </div>

      <div class="step-row bg-white">
        <div class="step-cell">
          <div class="step-name"></div>
        </div>
        <div class="step-cell">
          <div class="step-name"></div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
